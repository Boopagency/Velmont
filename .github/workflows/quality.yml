name: Qualidade Velmont
on: [push, pull_request]
permissions:
  contents: read
# The actions below stay on major tags: their commit SHAs could not be
# verified from the environment that wrote this file. Pin each one to its full
# commit SHA (keeping the tag as a comment) once a maintainer confirms it.
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm verify
      - run: pnpm check:functions
      - run: pnpm test
      - run: pnpm audit --audit-level moderate

  # Real Supabase Auth (GoTrue), PostgREST and PostgreSQL 17, the real build,
  # the Vercel emulation and Chromium. Only throwaway local keys: no secret or
  # production credential is used.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTRUE_VERSION: v2.186.0
      POSTGREST_VERSION: v13.0.7
      PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
      - name: Supabase Auth and PostgREST
        run: |
          mkdir -p "$RUNNER_TEMP/auth" "$RUNNER_TEMP/postgrest"
          curl -fsSL "https://github.com/supabase/auth/releases/download/${GOTRUE_VERSION}/auth-${GOTRUE_VERSION}-x86.tar.gz" | tar -xz -C "$RUNNER_TEMP/auth"
          curl -fsSL "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x86-64.tar.xz" | tar -xJ -C "$RUNNER_TEMP/postgrest"
          echo "GOTRUE_BIN=$RUNNER_TEMP/auth/auth" >> "$GITHUB_ENV"
          echo "POSTGREST_BIN=$RUNNER_TEMP/postgrest/postgrest" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
