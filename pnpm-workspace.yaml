allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# Security overrides for transitive dependencies whose parents still pin a
# vulnerable range. Each entry is reached only by dev/build tooling; none of
# these copies ships in the site or panel bundle. Drop each one once its parent
# publishes a release with the fixed version.
overrides:
  # oxfmt -> tinypool (GHSA-85c8-ppgw-ccpr, GHSA-5gmw-xhrv-c9v3)
  tinypool@<2.1.2: 2.2.0
  # wrangler / @cloudflare/vite-plugin -> miniflare -> sharp (GHSA-wq5f-xc86-pv6w).
  # The panel's own sharp is the direct dependency, already 0.35.5.
  sharp@<0.35.5: 0.35.5
  # wrangler / @cloudflare/vite-plugin -> miniflare -> undici (several GHSAs)
  undici@>=7.0.0 <7.30.1: 7.30.1
  # shadcn CLI -> ts-morph -> @ts-morph/common -> minimatch (GHSA-g3hv-75wg-m249).
  # ts-morph's latest release still asks for minimatch ^10. The CLI never runs
  # in build or CI; the app only imports shadcn/tailwind.css.
  minimatch@<11.0.1: 11.0.4
  # vinext -> @vercel/og -> satori -> fflate. The site renders no OG images.
  satori@<0.33.5: 0.33.5
  fflate@>=0.7.0 <0.7.5: 0.7.5
auditConfig:
  ignoreGhsas:
    # deepmerge <=4.3.1 prototype poisoning (low), via the shadcn CLI only.
    # The advisory names 4.3.2 as patched, but 4.3.1 is the latest version on
    # npm, so there is nothing to upgrade to yet. Remove once 4.3.2 ships.
    - GHSA-gcqx-w48m-w2h4
